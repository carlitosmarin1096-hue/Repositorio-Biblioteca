<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Virtual</title>

<link href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background-color: #f4f6fb;
}

/* HEADER */
header {
    background-color: #0e1f87;
    color: white;
    padding: 20px;
    text-align: center;
    position: relative;
}

/* BOTÓN LOGOUT */
#logoutBtn {
    position: absolute;
    right: 20px;
    top: 20px;
    background: #e80b0b;
    color: white;
    border: none;
    padding: 8px 12px;
    cursor: pointer;
    display: none;
}

/* LOGIN */
#loginContainer {
    max-width: 350px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

#loginContainer input, #loginContainer select {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
}

/* HERO */
.hero {
    background: linear-gradient(135deg, #0e1f87, #e80b0b);
    color: white;
    padding: 60px 20px;
    text-align: center;
}

.hero h1 { margin: 0; font-size: 40px; }
.hero p { margin-top: 10px; font-size: 18px; }

/* BOTONES */
.button {
    display: inline-block;
    padding: 12px 25px;
    margin: 10px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
}
.primary { background-color: #e80b0b; color: white; }
.secondary {
    background-color: white;
    color: #0e1f87;
    border: 2px solid #0e1f87;
}

/* SECCIÓN */
.section { padding: 40px 20px; }

/* BUSCADOR */
#busqueda {
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    border: 2px solid #0e1f87;
    margin: 20px 0;
}

/* CATÁLOGO */
#catalogo {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

/* TARJETAS */
.libro-card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    border-left: 6px solid #e80b0b;
}

.libro-card h4 { color: #0e1f87; }
.libro-card button {
    margin-top: 10px;
    background: #0e1f87;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    cursor: pointer;
}

/* FOOTER */
footer {
    background-color: #0e1f87;
    color: white;
    text-align: center;
    padding: 15px;
}
</style>
</head>

<body>

<header>
    <h2>📚 Biblioteca Virtual</h2>
    <button id="logoutBtn" onclick="logout()">Salir</button>
</header>

<!-- LOGIN -->
<div id="loginContainer">
    <h3>Iniciar sesión</h3>
    <input id="usuario" placeholder="Usuario">
    <input id="clave" type="password" placeholder="Contraseña">
    <button onclick="login()">Ingresar</button>

    <hr>

    <h3>Registro</h3>
    <input id="nuevoUsuario" placeholder="Usuario">
    <input id="nuevaClave" type="password" placeholder="Contraseña">

    <select id="rol">
        <option value="estudiante">Estudiante</option>
        <option value="docente">Docente</option>
        <option value="administrativo">Administrativo</option>
    </select>

    <button onclick="registrar()">Registrarse</button>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div id="contenido" style="display:none;">

<!-- HERO -->
<section class="hero">
    <h1>Sistema de Gestión - Repositorio de Tesis Digitales</h1>
    <p id="bienvenida"></p>
</section>

<!-- CATÁLOGO -->
<section class="section">
    <h2 style="text-align:center;">📖 Tesis Académicas</h2>
    <input type="text" id="busqueda" placeholder="Buscar tesis académica...">
    <div id="catalogo"></div>
</section>

</div>

<footer>
<p>&copy; 2026 Sistema de Biblioteca - Proyecto SENA</p>
</footer>

<script>
const libros = [
    {titulo: "Descentralización en la gestión de facturas de compra", autor: "Sara Gabriela Vargas"},
    {titulo: "Desarrollo de un plan de accion a Reto 59", autor: "Juan David Pulido"},
    {titulo: "Ruta de servicio Hotel de la Opera", autor: "Nathalia Monsalve Leon"},
    {titulo: "Tabla de Tarifas Internacionales", autor: "Juan Carlos Quiñones"}
];

const catalogo = document.getElementById("catalogo");
const busqueda = document.getElementById("busqueda");

/* REGISTRO */
function registrar(){
    const user = document.getElementById("nuevoUsuario").value;
    const pass = document.getElementById("nuevaClave").value;
    const rol = document.getElementById("rol").value;

    localStorage.setItem(user, JSON.stringify({password:pass, rol:rol}));
    alert("Usuario registrado");
}

/* LOGIN */
function login(){
    const user = document.getElementById("usuario").value;
    const pass = document.getElementById("clave").value;

    const data = JSON.parse(localStorage.getItem(user));

    if(data && data.password === pass){
        localStorage.setItem("sesion", user);
        iniciarSistema();
    } else {
        alert("Datos incorrectos");
    }
}

/* INICIAR SISTEMA */
function iniciarSistema(){
    const user = localStorage.getItem("sesion");
    const data = JSON.parse(localStorage.getItem(user));

    document.getElementById("loginContainer").style.display="none";
    document.getElementById("contenido").style.display="block";
    document.getElementById("logoutBtn").style.display="block";

    document.getElementById("bienvenida").innerText =
        "Bienvenido " + user + " (" + data.rol + ")";

    mostrarLibros(libros, data.rol);
}

/* MOSTRAR LIBROS CON ROL */
function mostrarLibros(lista, rol) {
    catalogo.innerHTML = "";

    lista.forEach(libro => {
        let accion = "";

        if(rol === "administrativo"){
            accion = "Editar";
        } else if(rol === "docente"){
            accion = "Aprobar";
        } else {
            accion = "Consultar";
        }

        catalogo.innerHTML += `
            <div class="libro-card">
                <h4>${libro.titulo}</h4>
                <p>${libro.autor}</p>
                <button>${accion} documento</button>
            </div>
        `;
    });
}

/* BUSQUEDA */
busqueda.addEventListener("keyup", () => {
    const texto = busqueda.value.toLowerCase();

    const user = localStorage.getItem("sesion");
    const data = JSON.parse(localStorage.getItem(user));

    const filtrados = libros.filter(l =>
        l.titulo.toLowerCase().includes(texto)
    );

    mostrarLibros(filtrados, data.rol);
});

/* LOGOUT */
function logout(){
    localStorage.removeItem("sesion");
    location.reload();
}

/* SESION ACTIVA */
if(localStorage.getItem("sesion")){
    iniciarSistema();
}
</script>

</body>
</html>
