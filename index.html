<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Virtual</title>

<link href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" rel="stylesheet">

<style>
body { margin:0; font-family:'IBM Plex Sans'; background:#f4f6fb; }

/* HEADER */
header {
    background:#0e1f87;
    color:white;
    padding:15px;
    text-align:center;
    position:relative;
}

/* BOTÓN LOGOUT */
.logout {
    position:absolute;
    right:15px;
    top:15px;
    background:#e80b0b;
    color:white;
    border:none;
    padding:8px 12px;
    cursor:pointer;
}

/* HERO */
.hero {
    background:linear-gradient(135deg,#0e1f87,#e80b0b);
    color:white;
    padding:40px;
    text-align:center;
}

/* LOGIN */
.login {
    max-width:350px;
    margin:50px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.login input, .login select {
    width:100%;
    padding:10px;
    margin:10px 0;
}

/* BOTONES */
button {
    width:100%;
    padding:10px;
    background:#0e1f87;
    color:white;
    border:none;
    cursor:pointer;
}
button:hover { background:#e80b0b; }

/* CATÁLOGO */
.section { padding:20px; }
#busqueda {
    width:100%;
    padding:10px;
    border:2px solid #0e1f87;
}

#catalogo {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:20px;
}

.libro-card {
    background:white;
    padding:15px;
    border-radius:10px;
    border-left:5px solid #e80b0b;
}

footer {
    background:#0e1f87;
    color:white;
    text-align:center;
    padding:10px;
}
</style>
</head>

<body>

<header>
    <h2>📚 Biblioteca Virtual</h2>
    <button class="logout" onclick="logout()">Salir</button>
</header>

<!-- LOGIN -->
<div id="login" class="login">
    <h3>Iniciar sesión</h3>
    <input id="usuario" placeholder="Usuario">
    <input id="clave" type="password" placeholder="Contraseña">
    <button onclick="login()">Ingresar</button>

    <hr>

    <h3>Registro</h3>
    <input id="nuevoUsuario" placeholder="Usuario">
    <input id="nuevaClave" type="password" placeholder="Contraseña">

    <select id="rol">
        <option value="estudiante">Estudiante</option>
        <option value="docente">Docente</option>
        <option value="administrativo">Administrativo</option>
    </select>

    <button onclick="registrar()">Registrarse</button>
</div>

<!-- SISTEMA -->
<div id="sistema" style="display:none;">

<section class="hero">
    <h1>Repositorio de Tesis Digitales</h1>
    <p id="bienvenida"></p>
</section>

<section class="section">
    <input type="text" id="busqueda" placeholder="Buscar tesis...">
    <div id="catalogo"></div>
</section>

</div>

<footer>
<p>&copy; 2026 Sistema de Biblioteca - SENA</p>
</footer>

<script>
const libros = [
    {titulo:"Descentralización en la gestión de facturas", autor:"Sara Vargas"},
    {titulo:"Plan de acción reto 59", autor:"Juan Pulido"},
    {titulo:"Ruta de servicio Hotel Opera", autor:"Nathalia Monsalve"},
    {titulo:"Tarifas internacionales", autor:"Juan Quiñones"}
];

/* REGISTRO */
function registrar(){
    const user = document.getElementById("nuevoUsuario").value;
    const pass = document.getElementById("nuevaClave").value;
    const rol = document.getElementById("rol").value;

    const data = {password:pass, rol:rol};
    localStorage.setItem(user, JSON.stringify(data));

    alert("Usuario registrado");
}

/* LOGIN */
function login(){
    const user = document.getElementById("usuario").value;
    const pass = document.getElementById("clave").value;

    const data = JSON.parse(localStorage.getItem(user));

    if(data && data.password === pass){
        localStorage.setItem("sesion", user);
        mostrarSistema();
    } else {
        alert("Datos incorrectos");
    }
}

/* MOSTRAR SISTEMA */
function mostrarSistema(){
    const user = localStorage.getItem("sesion");
    const data = JSON.parse(localStorage.getItem(user));

    document.getElementById("login").style.display="none";
    document.getElementById("sistema").style.display="block";

    document.getElementById("bienvenida").innerText =
        "Bienvenido " + user + " (" + data.rol + ")";

    cargarLibros(data.rol);
}

/* CARGAR SEGÚN ROL */
function cargarLibros(rol){
    const cont = document.getElementById("catalogo");
    cont.innerHTML="";

    libros.forEach(l=>{
        let boton = "";

        if(rol === "administrativo"){
            boton = `<button onclick="alert('Editar documento')">Editar</button>`;
        }
        else if(rol === "docente"){
            boton = `<button onclick="alert('Aprobar documento')">Aprobar</button>`;
        }
        else {
            boton = `<button onclick="alert('Consultar documento')">Consultar</button>`;
        }

        cont.innerHTML += `
            <div class="libro-card">
                <h4>${l.titulo}</h4>
                <p>${l.autor}</p>
                ${boton}
            </div>
        `;
    });
}

/* BUSQUEDA */
document.addEventListener("keyup", e=>{
    if(e.target.id==="busqueda"){
        const texto = e.target.value.toLowerCase();
        const filtrados = libros.filter(l=>l.titulo.toLowerCase().includes(texto));

        const cont = document.getElementById("catalogo");
        cont.innerHTML="";

        filtrados.forEach(l=>{
            cont.innerHTML += `
                <div class="libro-card">
                    <h4>${l.titulo}</h4>
                    <p>${l.autor}</p>
                </div>
            `;
        });
    }
});

/* LOGOUT */
function logout(){
    localStorage.removeItem("sesion");
    location.reload();
}

/* SESION ACTIVA */
if(localStorage.getItem("sesion")){
    mostrarSistema();
}
</script>

</body>
</html>
