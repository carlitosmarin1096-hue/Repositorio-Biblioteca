<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Virtual</title>

    <link href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: #f4f6fb;
        }

        /* HEADER */
        header {
            background-color: #0e1f87;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* HERO */
        .hero {
            background: linear-gradient(135deg, #0e1f87, #e80b0b);
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

        .hero h1 {
            margin: 0;
            font-size: 40px;
        }

        .hero p {
            margin-top: 10px;
            font-size: 18px;
        }

        /* BOTONES */
        .button {
            display: inline-block;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .primary {
            background-color: #e80b0b;
            color: white;
        }

        .secondary {
            background-color: white;
            color: #0e1f87;
            border: 2px solid #0e1f87;
        }

        /* SECCIÓN */
        .section {
            padding: 40px 20px;
        }

        /* BUSCADOR */
        #busqueda {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #0e1f87;
            margin: 20px 0;
        }

        /* CATÁLOGO */
        #catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* TARJETAS */
        .libro-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border-left: 6px solid #e80b0b;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .libro-card:hover {
            transform: translateY(-5px);
        }

        .libro-card h4 {
            color: #0e1f87;
            margin-bottom: 5px;
        }

        .libro-card p {
            color: #555;
        }

        .libro-card button {
            margin-top: 10px;
            background: #0e1f87;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .libro-card button:hover {
            background: #e80b0b;
        }

        /* FOOTER */
        footer {
            background-color: #0e1f87;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header>
    <h2>📚 Biblioteca Virtual</h2>
</header>

<!-- HERO -->
<section class="hero">
    <h1>Sistema de Gestión - Repositorio de Tesis Digitales</h1>
    <p>Consulta, busca y gestiona documentos académicos de manera fácil y rápida</p>

    <a href="#" class="button primary">Consultar catálogo</a>
    <a href="#" class="button secondary">Registrarse</a>
</section>

<!-- CATÁLOGO -->
<section class="section">
    <h2 style="text-align:center;">📖 Tesis Académicas</h2>

    <input type="text" id="busqueda" placeholder="Buscar libro...">

    <div id="catalogo"></div>
</section>

<!-- FOOTER -->
<footer>
    <p>&copy; 2026 Sistema de Biblioteca - Proyecto SENA</p>
</footer>

<!-- SCRIPT -->
<script>
const libros = [
    {titulo: "Descentralización en la gestión de facturas de compra", autor: "Sara Gabriela Vargas"},
    {titulo: "Desarrollo de un plan de accion a Reto 59 -Nasser, posterior a el analisis de la competencia", autor: "Juan David Pulido"},
    {titulo: "Ruta de servicio Hotel de la Opera", autor: "Nathalia Monsalve Leon"},
    {titulo: "Tabla de Tarifas y Cotizaciones Internacionales MARA BUSINESS GROUP ", autor: "Juan Carlos Quiñones"}
];

const catalogo = document.getElementById("catalogo");
const busqueda = document.getElementById("busqueda");

function mostrarLibros(lista) {
    catalogo.innerHTML = "";

    lista.forEach(libro => {
        catalogo.innerHTML += `
            <div class="libro-card">
                <h4>${libro.titulo}</h4>
                <p>${libro.autor}</p>
                <button onclick="prestarLibro('${libro.titulo}')">
                    Prestar libro
                </button>
            </div>
        `;
    });
}

function prestarLibro(titulo) {
    alert("📚 Has solicitado el libro: " + titulo);
}

busqueda.addEventListener("keyup", () => {
    const texto = busqueda.value.toLowerCase();

    const filtrados = libros.filter(l =>
        l.titulo.toLowerCase().includes(texto)
    );

    mostrarLibros(filtrados);
});

mostrarLibros(libros);
</script>

</body>
</html>
